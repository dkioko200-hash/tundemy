  <!-- Website -->
  <text x="300" y="274"
        fill="#2D7A45"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        letter-spacing="1">www.tundemy.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="306" width="820" height="6" fill="#2D7A45"/>

</svg>
